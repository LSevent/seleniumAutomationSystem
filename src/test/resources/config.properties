# Browser values: chrome, firefox, edge, chrome-headless
browser=chrome
headless=false
baseUrl=https://example.com
timeout=10

# Selenium Grid placeholder. Set remote=true and update gridUrl when using Grid.
remote=false
gridUrl=http://localhost:4444/wd/hub

# Keep true while this project points to placeholder URL/locators.
# Set to false after updating baseUrl, page locators, and test data for a real application.
demoMode=true

# Excel execution report settings.
report.showSensitiveData=false
report.screenshotOnFailure=true
report.manualScreenshotEnabled=true
