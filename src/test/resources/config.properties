# Java/TestNG demo test configuration.
#
# These settings are used by BaseTest, LoginTest, DashboardTest, and the
# Page Object demo flow. The configured Excel runner uses excelConfig.properties.

# Browser values supported by the Java/TestNG demo tests: chrome, firefox, edge, chrome-headless
browser=chrome
headless=false
baseUrl=https://example.com
timeout=10

# Selenium Grid placeholder. Set remote=true and update gridUrl when the run should use Grid.
remote=false
gridUrl=http://localhost:4444/wd/hub

# Keep true while this repo points to placeholder URL/locators.
# Set to false after baseUrl, page locators, and test data are updated for a real application.
demoMode=true
