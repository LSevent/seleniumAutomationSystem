# Browser values supported by this framework: chrome, firefox, edge, chrome-headless
browser=chrome
headless=false
baseUrl=https://example.com
timeout=10

# Selenium Grid placeholder. Set remote=true and update gridUrl when the run should use Grid.
remote=false
gridUrl=http://localhost:4444/wd/hub

# Keep true while this repo points to placeholder URL/locators.
# Set to false after baseUrl, page locators, and test data are updated for a real application.
demoMode=true

# Excel execution report settings.
report.showSensitiveData=false
report.screenshotOnFailure=true
report.manualScreenshotEnabled=true
